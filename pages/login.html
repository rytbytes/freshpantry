<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshPantry | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo"><span>🌿</span> FreshPantry</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../pages/catalog.html">Catalog</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-btn" class="icon-btn" title="Toggle Theme">🌙</button>
                <nav class="nav-links">
                    <a href="../pages/login.html" class="btn-secondary btn-small">Login</a>
                    <a href="../pages/register.html" class="btn-primary btn-small">Register</a>
                </nav>
                <button id="cart-btn" class="icon-btn" title="View Cart">🛒<span id="cart-badge" class="cart-badge">0</span></button>
            </div>
        </div>
    </header>
    <dialog id="cart-modal">
        <div class="dialog-header">
            <h3 class="dialog-title">Your Shopping Cart</h3>
            <form method="dialog"><button class="icon-btn" aria-label="Close cart">&times;</button></form>
        </div>
        <div class="dialog-body" id="cart-items-container">
            <p class="cart-empty">Your cart is empty.</p>
        </div>
        <div class="dialog-footer">
            <form method="dialog">
                <button class="btn-secondary keep-shopping">Keep Shopping</button>
                <button type="button" class="btn-accent checkout-btn">Checkout</button>
            </form>
        </div>
    </dialog>
    <main>
        <div class="page-view container active">
            <div class="form-wrapper login-wrapper">
                <h2 class="form-title login-title">Account Login</h2>
                <div class="demo-credentials"><strong>Admin Access:</strong> Use username <code>admin</code> and password <code>test@123</code></div>
                <form id="form-login">
                    <div class="form-group"><label class="required" for="login-user">Username</label><input type="text" id="login-user" class="form-control" required></div>
                    <div class="form-group"><label class="required" for="login-pwd">Password</label><input type="password" id="login-pwd" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary full-width-button">Secure Login</button>
                </form>
            </div>
        </div>
    </main>

<script src="../js/app.js"></script>
</body>
</html>
