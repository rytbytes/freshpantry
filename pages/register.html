<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshPantry | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo"><span>🌿</span> FreshPantry</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../pages/catalog.html">Catalog</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-btn" class="icon-btn" title="Toggle Theme">🌙</button>
                <nav class="nav-links">
                    <a href="../pages/login.html" class="btn-secondary btn-small">Login</a>
                    <a href="../pages/register.html" class="btn-primary btn-small">Register</a>
                </nav>
                <button id="cart-btn" class="icon-btn" title="View Cart">🛒<span id="cart-badge" class="cart-badge">0</span></button>
            </div>
        </div>
    </header>
    <dialog id="cart-modal">
        <div class="dialog-header">
            <h3 class="dialog-title">Your Shopping Cart</h3>
            <form method="dialog"><button class="icon-btn" aria-label="Close cart">&times;</button></form>
        </div>
        <div class="dialog-body" id="cart-items-container">
            <p class="cart-empty">Your cart is empty.</p>
        </div>
        <div class="dialog-footer">
            <form method="dialog">
                <button class="btn-secondary keep-shopping">Keep Shopping</button>
                <button type="button" class="btn-accent checkout-btn">Checkout</button>
            </form>
        </div>
    </dialog>
    <main>
        <div class="page-view container active">
            <div class="form-wrapper">
                <h2 class="form-title">Join FreshPantry</h2>
                <form action="/submit-registration" method="POST" id="form-register">
                    <fieldset><legend>Personal Information</legend>
                        <div class="form-group"><label class="required" for="reg-fname">First Name</label><input type="text" id="reg-fname" name="firstName" class="form-control" required minlength="2"></div>
                        <div class="form-group"><label class="required" for="reg-phone">Phone Number</label><input type="tel" id="reg-phone" name="phone" class="form-control" required pattern="[0-9]{10}" title="Must be exactly 10 digits" placeholder="e.g. 1234567890"></div>
                    </fieldset>
                    <fieldset><legend>Account Security & Location</legend>
                        <div class="form-group"><label class="required" for="reg-email">Email Address</label><input type="email" id="reg-email" name="email" class="form-control" required></div>
                        <div class="form-group"><label class="required" for="reg-pwd">Password</label><input type="password" id="reg-pwd" name="password" class="form-control" required minlength="8" placeholder="Minimum 8 characters"></div>
                        <div class="form-group"><label for="reg-region">Preferred Delivery Region</label><select id="reg-region" name="region" class="form-control"><option value="">Select a region (Optional)</option><optgroup label="North America"><option value="us">United States</option><option value="ca">Canada</option></optgroup><optgroup label="Europe"><option value="uk">United Kingdom</option><option value="eu">Mainland Europe</option></optgroup></select></div>
                    </fieldset>
                    <button type="submit" class="btn btn-primary full-width-button">Create Account</button>
                </form>
            </div>
        </div>
    </main>

<script src="../js/app.js"></script>
</body>
</html>
