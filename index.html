<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshPantry | Premium Groceries & Produce</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo"><span>🌿</span> FreshPantry</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="pages/catalog.html">Catalog</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-btn" class="icon-btn" title="Toggle Theme">🌙</button>
                <nav class="nav-links">
                    <a href="pages/login.html" class="btn-secondary btn-small">Login</a>
                    <a href="pages/register.html" class="btn-primary btn-small">Register</a>
                </nav>
                <button id="cart-btn" class="icon-btn" title="View Cart">🛒<span id="cart-badge" class="cart-badge">0</span></button>
            </div>
        </div>
    </header>
    <dialog id="cart-modal">
        <div class="dialog-header">
            <h3 class="dialog-title">Your Shopping Cart</h3>
            <form method="dialog"><button class="icon-btn" aria-label="Close cart">&times;</button></form>
        </div>
        <div class="dialog-body" id="cart-items-container">
            <p class="cart-empty">Your cart is empty.</p>
        </div>
        <div class="dialog-footer">
            <form method="dialog">
                <button class="btn-secondary keep-shopping">Keep Shopping</button>
                <button type="button" class="btn-accent checkout-btn">Checkout</button>
            </form>
        </div>
    </dialog>

    <main>
        <div class="page-view container active">
            <section class="hero">
                <h1>Nature's Bounty, Delivered.</h1>
                <p>Stock your pantry with the finest organic produce, premium nuts, and daily staples sourced directly from sustainable farms.</p>
                <a href="pages/catalog.html" class="btn-primary hero-button">Shop the Catalog</a>
            </section>
        </div>
    </main>

<script src="js/app.js"></script>
</body>
</html>
